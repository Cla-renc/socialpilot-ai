version: '3.9'

services:
  app:
    image: php:8.2-fpm
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: socialpilot
      DB_USERNAME: socialpilot
      DB_PASSWORD: socialpilot
      TREND_ENGINE_URL: http://trend-engine:8080
      TREND_ENGINE_INTERNAL_TOKEN: ${TREND_ENGINE_INTERNAL_TOKEN:?Set TREND_ENGINE_INTERNAL_TOKEN in .env}
      TREND_RSS_FEEDS: ${TREND_RSS_FEEDS:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-${NEWS_API_KEY:-}}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-${YOUTUBE_DATA_API_KEY:-}}
      GOOGLE_TRENDS_API_KEY: ${GOOGLE_TRENDS_API_KEY:-}
    depends_on:
      - mysql
      - redis
      - trend-engine

  trend-engine:
    build:
      context: ./ai_engine
    environment:
      TREND_ENGINE_INTERNAL_TOKEN: ${TREND_ENGINE_INTERNAL_TOKEN:?Set TREND_ENGINE_INTERNAL_TOKEN in .env}
      TREND_RSS_FEEDS: ${TREND_RSS_FEEDS:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-${NEWS_API_KEY:-}}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-${YOUTUBE_DATA_API_KEY:-}}
      GOOGLE_TRENDS_API_KEY: ${GOOGLE_TRENDS_API_KEY:-}
      TREND_ENABLE_OLLAMA_ANALYSIS: ${TREND_ENABLE_OLLAMA_ANALYSIS:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
    expose:
      - '8080'

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: socialpilot
      MYSQL_USER: socialpilot
      MYSQL_PASSWORD: socialpilot
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  queue:
    image: php:8.2-cli
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: socialpilot
      DB_USERNAME: socialpilot
      DB_PASSWORD: socialpilot
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      TREND_ENGINE_URL: http://trend-engine:8080
      TREND_ENGINE_INTERNAL_TOKEN: ${TREND_ENGINE_INTERNAL_TOKEN:?Set TREND_ENGINE_INTERNAL_TOKEN in .env}
      TREND_RSS_FEEDS: ${TREND_RSS_FEEDS:-}
      NEWSAPI_API_KEY: ${NEWSAPI_API_KEY:-${NEWS_API_KEY:-}}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-${YOUTUBE_DATA_API_KEY:-}}
      GOOGLE_TRENDS_API_KEY: ${GOOGLE_TRENDS_API_KEY:-}
    depends_on:
      - mysql
      - redis
      - trend-engine
