networks:
  socialpilot-internal:
    driver: bridge

volumes:
  mysql_test_data:
    driver: local

services:
  # ============================================================================
  # SERVICE 1: DECOUPLED LARAVEL CORE & WEB SERVICE
  # ============================================================================
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile.laravel
    image: socialpilot-laravel:latest
    container_name: socialpilot_laravel_app
    restart: unless-stopped
    networks:
      - socialpilot-internal
    ports:
      - "${LARAVEL_HOST_PORT:-8000}:80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 128M
    environment:
      APP_NAME: "${APP_NAME:-SocialPilot AI}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"

      # Database Configuration (Isolated local test MySQL)
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql-test}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-socialpilot_local}"
      DB_USERNAME: "${DB_USERNAME:-socialpilot_user}"
      DB_PASSWORD: "${DB_PASSWORD}"

      # Session, Cache & Queue (In-Database)
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # Storage
      FILESYSTEM_DISK: local
      MEDIA_STORAGE_DISK: local

      # Decoupled Python Service Hostname (Communicates internally over Docker bridge)
      AI_ENGINE_URL: http://python-ai-engine:8080
      AI_ENGINE_INTERNAL_TOKEN: "${AI_ENGINE_INTERNAL_TOKEN}"
      TREND_ENGINE_URL: http://python-ai-engine:8080
      TREND_ENGINE_INTERNAL_TOKEN: "${AI_ENGINE_INTERNAL_TOKEN}"

      # Internal Ops Cycle Authentication
      INTERNAL_CRON_SECRET: "${INTERNAL_CRON_SECRET}"

    depends_on:
      mysql-test:
        condition: service_healthy
      python-ai-engine:
        condition: service_healthy

  # ============================================================================
  # SERVICE 2: DECOUPLED PYTHON / FASTAPI AI ENGINE (Internal Network Only)
  # ============================================================================
  python-ai-engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    image: socialpilot-ai-engine:latest
    container_name: socialpilot_python_ai
    restart: unless-stopped
    networks:
      - socialpilot-internal
    # NOTE: Port 8080 is NOT published to host interface. Inaccessible publicly.
    expose:
      - '8080'
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          memory: 64M
    environment:
      AI_ENGINE_INTERNAL_TOKEN: "${AI_ENGINE_INTERNAL_TOKEN}"
      TREND_ENGINE_INTERNAL_TOKEN: "${AI_ENGINE_INTERNAL_TOKEN}"
      TREND_ENABLE_OLLAMA_ANALYSIS: 'false'
      NEWSAPI_API_KEY: "${NEWSAPI_API_KEY:-}"
      REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID:-}"
      REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET:-}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      GOOGLE_TRENDS_API_KEY: "${GOOGLE_TRENDS_API_KEY:-}"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # SERVICE 3: ISOLATED LOCAL TEST DATABASE (Never touches Production TiDB)
  # ============================================================================
  mysql-test:
    image: mysql:8.0
    container_name: socialpilot_mysql_test
    restart: unless-stopped
    networks:
      - socialpilot-internal
    # NOTE: Port 3306 is NOT published to the host to prevent accidental exposure.
    expose:
      - '3306'
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${DB_DATABASE:-socialpilot_local}"
      MYSQL_USER: "${DB_USERNAME:-socialpilot_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - mysql_test_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # PRESERVED REFERENCE: UNIFIED ALL-IN-ONE CONTAINER (Profile: unified)
  # ============================================================================
  socialpilot-unified:
    profiles:
      - unified
    build:
      context: .
      dockerfile: Dockerfile.unified
    image: socialpilot-unified:latest
    container_name: socialpilot_unified_app
    restart: unless-stopped
    networks:
      - socialpilot-internal
    ports:
      - "${UNIFIED_HOST_PORT:-8001}:80"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    environment:
      APP_NAME: "${APP_NAME:-SocialPilot AI (Unified)}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8001}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-mysql-test}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-socialpilot_local}"
      DB_USERNAME: "${DB_USERNAME:-socialpilot_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      MEDIA_STORAGE_DISK: local
      AI_ENGINE_URL: http://127.0.0.1:8080
      AI_ENGINE_INTERNAL_TOKEN: "${AI_ENGINE_INTERNAL_TOKEN}"
      TREND_ENGINE_URL: http://127.0.0.1:8080
      TREND_ENGINE_INTERNAL_TOKEN: "${AI_ENGINE_INTERNAL_TOKEN}"
      INTERNAL_CRON_SECRET: "${INTERNAL_CRON_SECRET}"
    depends_on:
      mysql-test:
        condition: service_healthy
