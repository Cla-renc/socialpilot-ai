version: '3.9'

services:
  # ============================================================================
  # TARGET PRODUCTION / STAGING UNIFIED CONTAINER (All-in-One Deployment Mode)
  # ============================================================================
  socialpilot-unified:
    build:
      context: .
      dockerfile: Dockerfile
    image: socialpilot-ai:latest
    container_name: socialpilot_unified_app
    restart: unless-stopped
    ports:
      - '8000:80'
    environment:
      APP_NAME: 'SocialPilot AI'
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY:-base64:XG8d2L5zN4m1Y9qK8vP3wE2rT1yU0iO9pA8sD7fG6hJ=}
      APP_URL: http://localhost:8000
      FORCE_HTTPS: 'false'

      # Database Configuration (Uses isolated container MySQL or SQLite)
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: 3306
      DB_DATABASE: socialpilot_local
      DB_USERNAME: socialpilot_user
      DB_PASSWORD: socialpilot_secret

      # Session, Cache & Queue (In-Database)
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      # Storage (Local disk inside container)
      FILESYSTEM_DISK: local
      MEDIA_STORAGE_DISK: local

      # Internal AI Engine (FastAPI runs on 127.0.0.1:8080 inside the container)
      AI_ENGINE_URL: http://127.0.0.1:8080
      AI_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:-dev-internal-token-change-in-prod}
      TREND_ENGINE_URL: http://127.0.0.1:8080
      TREND_ENGINE_INTERNAL_TOKEN: ${AI_ENGINE_INTERNAL_TOKEN:-dev-internal-token-change-in-prod}

      # Internal Ops Cycle Authentication
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET:-local-ops-cron-secret-32-chars}

    depends_on:
      mysql-test:
        condition: service_healthy

  # ============================================================================
  # ISOLATED LOCAL TEST DATABASE (Never touches Production TiDB)
  # ============================================================================
  mysql-test:
    image: mysql:8.0
    container_name: socialpilot_mysql_test
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_pass
      MYSQL_DATABASE: socialpilot_local
      MYSQL_USER: socialpilot_user
      MYSQL_PASSWORD: socialpilot_secret
    ports:
      - '33066:3306'
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-proot_secret_pass']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_test_data:
    driver: local
