[supervisord]
nodaemon=true

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
autostart=true
autorestart=true
stderr_logfile=/var/log/socialpilot-queue.err.log
stdout_logfile=/var/log/socialpilot-queue.out.log
user=www-data
